services:
  - type: web
    name: prima-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1"
      - key: TEXT_MODEL
        value: "gemini-2.5-flash"
      - key: TTS_MODEL
        value: "gemini-2.5-flash"
      - key: GEMINI_API_KEYS
        value: "AQ.Ab8RN6IhyeYZ4sP_WAUP_knLiwhUPd_P8_rcG8ajGC7uelgE4Q"
      - key: GEMINI_TTS_KEYS
        value: "AQ.Ab8RN6IhyeYZ4sP_WAUP_knLiwhUPd_P8_rcG8ajGC7uelgE4Q"
