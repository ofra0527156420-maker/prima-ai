services:
  - type: web
    name: prima-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: EXTENSIONS
        value: "[{\"p\":\"1\",\"m\":\"2\",\"g\":\"שלום וברוכים הבאים לקו המשפחתי של משפחת מיראי. שמחים כל כך שהצטרפתם! הקו נועד לחבר בינינו, להתעדכן בשמחות, להישאר קרובים ולהרגיש ביחד תמיד – ההורים, הילדים, הגיסים והנכדים. להודעות, חדשות ועדכונים משפחתיים לחצו 1. לשמחות, ימי הולדת וימי נישואין לחצו 2. לדברי תורה, פרשת השבוע והתחזקות לחצו 3. לפינת ה\",\"x\":\"\"},{\"p\":\"2\",\"m\":\"3\",\"g\":\"הגעתם ללוח העדכונים של משפחת מיראי. כאן אפשר לשמוע על האירועים, המפגשים והחדשות המשפחתיות החמות ביותר של אבא חיים, אמא ציפורה, הילדים, הנכדים וכל המחותנים. שתפו אותנו בבשורות טובות!\",\"x\":\"אתה עוזר משפחתי חם. תפקידך לרכז ולעדכן על יוזמות משפחתיות, מפגשים קרובים, וחדשות משמחות של בני משפחת מיראי.\"},{\"p\":\"3\",\"m\":\"2\",\"g\":\"הגעתם לפינת שבת אחים גם יחד של משפחת מיראי. כאן נשמע רעיון קצר, מעורר השראה ומחזק על פרשת השבוע או מחשבת ישראל שתלווה את כולנו לקראת השבת.\",\"x\":\"אתה מומחה לתורה ופרשת השבוע. תן מסר קצר, מרומם לב ומתאים למשפחה חרדית.\"},{\"p\":\"4\",\"m\":\"2\",\"g\":\"הגעתם לפינת הנוסטלגיה והסיפורים של משפחת מיראי. כאן נשמע זיכרונות מתוקים, חוויות מהעבר וסיפורים מיוחדים של הסבים, ההורים והמשפחה.\",\"x\":\"אתה עוזר משפחתי חם שאחראי על שימור ההיסטוריה והחוויות של משפחת מיראי.\"},{\"p\":\"5\",\"m\":\"2\",\"g\":\"הגעתם לפינת הטריויה המשפחתית של משפחת מיראי! כאן נבחן כמה טוב אתם מכירים את ההיסטוריה, החוויות והסיפורים של המשפחה שלנו. מוכנים לאתגר? הבוט יציג לכם כעת שאלה משפחתית מרתקת. בואו נראה מי יודע ראשון\",\"x\":\"אתה מנחה שעשעון טריויה משפחתי חם, שנון ומעודד. שאל שאלות מחכימות ומהנות על ההיסטוריה של משפחת מיראי, על חוויות ילדות של האחים, על מנהגים משפחתיים, או שאלות כלליות ביהדות ובחגים באווירה משפחתית שמחה. לאחר שהמשתמש עונה, הגב בצורה משעשעת ומחזקתאתה מנחה שעשעון טריויה משפחתי חם, שנון ומעודד. שאל שאלות מחכימות ומהנות על ההיסטוריה של משפחת מיראי, על חוויות ילדות של האחים, על מנהגים משפחתיים, או שאלות כלליות ביהדות ובחגים באווירה משפחתית שמחה. לאחר שהמשתמש עונה, הגב בצורה משעשעת ומחזקת\"}]"
      - key: MAX_WORDS
        value: "25"
      - key: EXTRA_INSTRUCTION
        value: "אתה הבוט הקולי הרשמי של משפחת מיראי. מטרתך לחבר בין בני המשפחה (ההורים חיים וציפורה, הילדים, הגיסים והנכדים), לעודד אחדות, לשתף שמחות ועדכונים משפחתיים, ולייצר אווירה חמה, משפחתית, מקרבת, מכובדת וזורמת. דבר בעברית רהוטה, חמה ונעימה שמותאמת להקראה קולית"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
